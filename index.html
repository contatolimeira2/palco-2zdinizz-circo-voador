<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palco 3D · 2ZDINIZZ · Circo Voador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#ff2a3a;--white:#f2f2f2;--muted:#9a9a9a;--bg:#050505}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--white);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0));pointer-events:none}
  .brand{display:flex;align-items:center;gap:22px;min-width:0}
  .brand img{height:52px;width:auto}
  .titles h1{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;line-height:34px;letter-spacing:2px}
  .titles p{margin:2px 0 0;font-size:12px;letter-spacing:3px;font-weight:700;color:var(--red)}
  .logos{display:flex;align-items:center;gap:16px}
  .logos img.hhr{height:34px}
  .logos img.fb{height:50px}
  .logos .sep{width:1px;height:44px;background:#4a4a4a}
  nav{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);display:flex;flex-wrap:nowrap;justify-content:center;gap:8px;padding:8px;background:rgba(12,12,12,.82);border:1px solid #2a2a2a;border-radius:12px;backdrop-filter:blur(6px);max-width:calc(100% - 24px)}
  nav button{min-height:44px;padding:0 14px;white-space:nowrap;border:1px solid #333;border-radius:8px;background:#151515;color:var(--white);font:700 12px/1 Inter,sans-serif;letter-spacing:1.5px;cursor:pointer}
  nav button:hover,nav .navlink:hover{border-color:var(--muted)}
  nav .navlink{display:inline-flex;align-items:center;flex:none;min-height:44px;padding:0 14px;border:1px solid #333;border-radius:8px;background:#151515;color:var(--white);font:700 12px/1 Inter,sans-serif;letter-spacing:1.5px;text-decoration:none;white-space:nowrap}
  nav button[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
  footer{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 28px;background:rgba(6,6,6,.92);border-top:1px solid #2a2a2a;box-shadow:0 -1px 0 0 rgba(255,42,58,.55);pointer-events:none}
  footer .crew{display:flex;align-items:center;gap:18px;white-space:nowrap;min-width:0}
  footer .crew span{display:flex;align-items:baseline;gap:8px}
  footer b{font:400 16px/1 Anton,Impact,sans-serif;letter-spacing:2px;color:var(--white)}
  footer i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--red)}
  footer em{font-style:normal;font-size:11px;letter-spacing:1px;color:var(--muted)}
  footer .dot{width:5px;height:5px;border-radius:50%;background:#444}
  footer .made{display:flex;align-items:center;gap:10px;font-size:9px;font-weight:700;letter-spacing:3px;color:var(--muted)}
  footer .made img{height:26px;width:auto}
  .hint{position:fixed;right:28px;bottom:118px;font-size:11px;letter-spacing:1px;color:var(--muted);text-align:right;pointer-events:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:700 13px Inter,sans-serif;letter-spacing:3px;color:var(--muted);pointer-events:none}
  @media (max-width:760px), (max-height:520px){
    header{padding:10px 12px;gap:10px}
    .brand{gap:10px}.brand img{height:26px}
    .titles h1{font-size:15px;line-height:18px;letter-spacing:1px}.titles p{font-size:8px;letter-spacing:1.5px}
    .logos{gap:8px}.logos img.hhr{height:16px}.logos img.fb{height:22px}.logos .sep{height:20px}
    nav{left:8px;right:8px;bottom:42px;transform:none;max-width:none;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;gap:6px;padding:6px;border-radius:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    nav::-webkit-scrollbar{display:none}
    nav button,nav .navlink{flex:none;min-height:40px;padding:0 12px;font-size:10px;letter-spacing:1px}
    footer{padding:8px 12px;gap:10px}footer .crew{gap:8px}footer b{font-size:12px;letter-spacing:1px}footer i{font-size:8px;letter-spacing:1px}footer em{display:none}
    .hint{display:none}
  }
</style>

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const DECK = 1.59;            // altura do palco
const Z = y => y - 6;         // planta (0 fundo … 6 boca) → z do mundo (−6 … 0)
const PI = Math.PI;

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.autoClear = false;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040404);
scene.fog = new THREE.FogExp2(0x050505, 0.022);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const labelScene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = PI * 0.495; controls.minDistance = 1.5; controls.maxDistance = 70;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.55, 0.93);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ------------------------------------------------------------------ texturas procedurais
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function noise(ctx, w, h, a) { const d = ctx.getImageData(0, 0, w, h); for (let i = 0; i < d.data.length; i += 4) { const n = (Math.random() - .5) * a; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; } ctx.putImageData(d, 0, 0); }

const T = {
  planks: canvasTex(1024, 1024, (c, w, h) => {
    const n = 12;
    for (let i = 0; i < n; i++) {
      const base = 52 + Math.random() * 18;
      c.fillStyle = `rgb(${base + 22},${base},${base - 18})`; c.fillRect(0, i * h / n, w, h / n);
      for (let k = 0; k < 40; k++) { c.strokeStyle = `rgba(20,10,0,${Math.random() * .25})`; c.lineWidth = 1 + Math.random() * 2; const y = i * h / n + Math.random() * h / n; c.beginPath(); c.moveTo(0, y); c.bezierCurveTo(w * .3, y + 4, w * .6, y - 4, w, y + 2); c.stroke(); }
      c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(0, i * h / n, w, 3);
      const cut = Math.random() * w; c.fillRect(cut, i * h / n, 3, h / n);
    }
    noise(c, w, h, 18);
  }, [3, 3]),
  floorDark: canvasTex(1024, 1024, (c, w, h) => {
    const n = 16;
    for (let i = 0; i < n; i++) { const b = 30 + Math.random() * 12; c.fillStyle = `rgb(${b + 12},${b + 4},${b - 4})`; c.fillRect(i * w / n, 0, w / n, h); c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(i * w / n, 0, 2, h); }
    noise(c, w, h, 14);
  }, [12, 12]),
  grille: canvasTex(256, 256, (c, w, h) => {
    c.fillStyle = '#1a1a1a'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#050505';
    for (let y = 4; y < h; y += 8) for (let x = (y / 8 % 2) * 4 + 4; x < w; x += 8) { c.beginPath(); c.arc(x, y, 2.6, 0, PI * 2); c.fill(); }
  }, [4, 4]),
  paint: canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#1c1c1c'; c.fillRect(0, 0, w, h); noise(c, w, h, 30); }, [2, 2]),
  tolex: canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#141414'; c.fillRect(0, 0, w, h); noise(c, w, h, 45); }, [2, 2]),
  grilleCloth: canvasTex(256, 256, (c, w, h) => {
    c.fillStyle = '#2b2b2b'; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(160,150,130,.35)'; c.lineWidth = 1;
    for (let i = -h; i < w; i += 5) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i + h, h); c.stroke(); c.beginPath(); c.moveTo(i + h, 0); c.lineTo(i, h); c.stroke(); }
  }, [2, 2]),
  velvet: canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#2a1a13'; c.fillRect(0, 0, w, h); noise(c, w, h, 16); }, [6, 3]),
  fascia: canvasTex(512, 256, (c, w, h) => { c.fillStyle = '#a7a7a5'; c.fillRect(0, 0, w, h); noise(c, w, h, 14); c.fillStyle = 'rgba(0,0,0,.08)'; for (let x = 0; x < w; x += 128) c.fillRect(x, 0, 2, h); }, [6, 1]),
  canvasFab: canvasTex(512, 512, (c, w, h) => { c.fillStyle = '#b8a98b'; c.fillRect(0, 0, w, h); noise(c, w, h, 20); c.fillStyle = 'rgba(80,60,30,.18)'; for (let y = 0; y < h; y += 64) c.fillRect(0, y, w, 3); }, [8, 6]),
};

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {

}
const box = (w, h, d, mat, x, y, z, p, s) => mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, p, s);
const cyl = (rt, rb, h, mat, x, y, z, p, seg = 20) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, p);
function rbox(w, h, d, r, mat, x, y, z, p) { // caixa com cantos arredondados (extrude)

  s.moveTo(-hw, -h / 2); s.lineTo(hw, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -hh); s.lineTo(w / 2, hh); s.quadraticCurveTo(w / 2, h / 2, hw, h / 2); s.lineTo(-hw, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, hh); s.lineTo(-w / 2, -hh); s.quadraticCurveTo(-w / 2, -h / 2, -hw, -h / 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: d - 2 * r * .5, bevelEnabled: true, bevelSize: r * .5, bevelThickness: r * .5, bevelSegments: 3, curveSegments: 6 });
  g.translate(0, 0, -(d - r) / 2);
  return mesh(g, mat, x, y, z, p);
}

}

const labels = [];
function label(text, x, y, z, opts = {}) {
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  const fs = 46; const font = '700 ' + fs + 'px Inter, Arial, sans-serif'; ctx.font = font;
  const lines = text.split('\n');
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 58; const h = lines.length * fs * 1.22 + 30;
  c.width = Math.ceil(w); c.height = Math.ceil(h); ctx.font = font;
  ctx.fillStyle = 'rgba(8,8,8,0.84)';
  ctx.beginPath(); ctx.roundRect(0, 0, c.width, c.height, 14); ctx.fill();
  ctx.fillStyle = opts.accent ? '#ff2a3a' : '#e9e9e9'; ctx.fillRect(0, 0, 8, c.height);
  ctx.fillStyle = '#f2f2f2'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, 30, 15 + fs * .62 + i * fs * 1.22));
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, toneMapped: false }));
  const s = (opts.size || .3) / (fs * 1.22 + 30) * c.height;
  sp.scale.set(s * c.width / c.height, s, 1); sp.position.set(x, y, z);
  labelScene.add(sp); labels.push(sp); return sp;
}

function boxTruss(curve, size = .29) { // treliça Q30 ao longo de uma curva
  const N = 44, pts = curve.getSpacedPoints(N); const up = new THREE.Vector3(0, 1, 0);
  const offs = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(o => o.map(v => v * size / 2));
  const chord = offs.map(() => []);
  pts.forEach((pt, i) => {
    const t = curve.getTangentAt(i / N); const side = new THREE.Vector3().crossVectors(t, up).normalize(); const nup = new THREE.Vector3().crossVectors(side, t).normalize();
    offs.forEach((o, k) => chord[k].push(pt.clone().addScaledVector(side, o[0]).addScaledVector(nup, o[1])));
  });
  chord.forEach(c => mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(c), 120, .024, 6, false), M.truss, 0, 0, 0, overhead, false));
  const lace = new THREE.CylinderGeometry(.01, .01, 1, 5);
  for (let i = 0; i < N; i++) for (let k = 0; k < 4; k++) {
    const a = chord[k][i], b = chord[(k + 1) % 4][i + 1];
    const m = mesh(lace, M.truss, 0, 0, 0, overhead, false); m.position.copy(a).add(b).multiplyScalar(.5);
    m.scale.y = a.distanceTo(b); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  }
}

function wedge(x, z, rotY, name, brand = 'EAW') {
  const g = new THREE.Group(); g.position.set(x, DECK, z); g.rotation.y = rotY; scene.add(g);
  const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(.56, 0); s.lineTo(.56, .14); s.lineTo(.12, .39); s.lineTo(0, .39); s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: .62, bevelEnabled: true, bevelSize: .012, bevelThickness: .012, bevelSegments: 2 });
  geo.translate(0, 0, -.31); geo.rotateY(-PI / 2); // perfil: frente inclinada aponta p/ +z
  mesh(geo, M.cab, 0, 0, 0, g);
  const len = Math.hypot(.44, .25); const gr = mesh(new THREE.PlaneGeometry(.58, len - .04), M.grille, 0, .265, .345, g, false);
  gr.rotation.x = -Math.atan2(.44, .25);
  gr.position.set(0, .265 + .007, .34 + .006);
  const lg = logoPlane(brand, .1, .2, .17, .57, g); lg.rotation.x = 0;
  [-1, 1].forEach(sx => box(.05, .02, .05, M.rubber, sx * .26, .01, .45, g));
  label(name, x, DECK + .7, z, { size: .2 });
  return g;
}

function micStand(x, z, h = 1.5, rotY = 0, boom = true) {
  const g = new THREE.Group(); g.position.set(x, DECK, z); g.rotation.y = rotY; scene.add(g);
  for (let i = 0; i < 3; i++) { const a = i * PI * 2 / 3; const l = cyl(.009, .009, .34, M.steel, Math.cos(a) * .13, .1, Math.sin(a) * .13, g, 8); l.rotation.set(Math.sin(a) * .9, 0, -Math.cos(a) * .9); }
  cyl(.014, .014, h - .2, M.steel, 0, .15 + (h - .2) / 2, 0, g, 10);
  cyl(.018, .018, .05, M.plasticBlack, 0, h - .02, 0, g, 10);
  const top = new THREE.Group(); top.position.y = h; g.add(top);
  let micParent = top;
  if (boom) { const b = new THREE.Group(); b.rotation.x = .9; top.add(b); cyl(.01, .01, .55, M.steel, 0, .2, 0, b, 8); const e = new THREE.Group(); e.position.y = .45; b.add(e); micParent = e; }
  const mic = new THREE.Group(); micParent.add(mic); mic.rotation.x = boom ? -.3 : .9;

  const ball = mesh(new THREE.SphereGeometry(.03, 18, 12), M.grille, 0, .19, 0, mic); ball.material = M.chrome.clone(); ball.material.roughness = .45;
  cyl(.022, .022, .03, M.alu, 0, .16, 0, mic, 14);

// --- sax (tenor) ---
function saxophone() {
  const g = new THREE.Group();
  const pts = [[0, .62, .02], [0, .5, 0], [0, .2, 0], [0, .02, .02], [0, -.07, .09], [0, -.02, .17], [0, .1, .19], [0, .2, .2]].map(p => new THREE.Vector3(...p));
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.TubeGeometry(curve, 60, .03, 14, false);
  // afunilamento
  const p = tube.attributes.position; const center = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { const seg = Math.floor(i / 15) / 60; const c = curve.getPoint(seg); const v = new THREE.Vector3(p.getX(i), p.getY(i), p.getZ(i)); const d = v.sub(c).multiplyScalar(.6 + seg * 1.25); p.setXYZ(i, c.x + d.x, c.y + d.y, c.z + d.z); }
  tube.computeVertexNormals();
  mesh(tube, M.brass, 0, 0, 0, g);
  const bellPts = []; for (let i = 0; i <= 12; i++) { const t = i / 12; bellPts.push(new THREE.Vector2(.05 + Math.pow(t, 2.4) * .08, t * .1)); }
  mesh(new THREE.LatheGeometry(bellPts, 28), M.brass, 0, .2, .2, g).material = M.brass;
  const neck = new THREE.CatmullRomCurve3([new THREE.Vector3(0, .62, .02), new THREE.Vector3(0, .7, .0), new THREE.Vector3(0, .72, -.08)]);
  mesh(new THREE.TubeGeometry(neck, 20, .012, 10, false), M.brass, 0, 0, 0, g);
  cyl(.012, .008, .05, M.plasticBlack, 0, .72, -.105, g, 10).rotation.x = PI / 2;
  for (let i = 0; i < 9; i++) cyl(.012, .012, .008, M.chrome, .028, .5 - i * .05, .012, g, 10).rotation.z = PI / 2;
  return g;
}

// --- guitarra ---
function guitar() {
  const g = new THREE.Group();
  const s = new THREE.Shape();
  s.moveTo(0, -.24); s.bezierCurveTo(.2, -.24, .2, -.06, .13, -.02); s.bezierCurveTo(.1, .0, .15, .1, .14, .14); s.bezierCurveTo(.12, .22, .05, .2, .03, .17);
  s.lineTo(-.03, .17); s.bezierCurveTo(-.06, .22, -.15, .2, -.14, .12); s.bezierCurveTo(-.13, .06, -.1, .02, -.13, -.02); s.bezierCurveTo(-.2, -.08, -.2, -.24, 0, -.24);
  const bodyMat = new THREE.MeshPhysicalMaterial({ color: 0x7a0b12, roughness: .25, clearcoat: 1, clearcoatRoughness: .08 });
  const geo = new THREE.ExtrudeGeometry(s, { depth: .04, bevelEnabled: true, bevelSize: .008, bevelThickness: .008, bevelSegments: 3, curveSegments: 24 });
  geo.translate(0, 0, -.02); mesh(geo, bodyMat, 0, 0, 0, g);
  const pg = new THREE.Shape(); pg.moveTo(-.02, .12); pg.lineTo(.06, .1); pg.lineTo(.09, -.05); pg.lineTo(.02, -.16); pg.lineTo(-.08, -.1); pg.lineTo(-.06, .05); pg.closePath();
  mesh(new THREE.ShapeGeometry(pg), new THREE.MeshStandardMaterial({ color: 0xf0eee6, roughness: .4 }), 0, 0, .029, g, false);
  box(.05, .62, .025, new THREE.MeshStandardMaterial({ color: 0x5a3a1e, roughness: .45 }), 0, .47, .01, g);
  box(.075, .17, .018, M.plasticBlack, 0, .85, .008, g);
  for (let i = 0; i < 3; i++) [-1, 1].forEach(k => cyl(.006, .006, .03, M.chrome, k * .045, .8 + i * .045, .01, g, 8).rotation.z = PI / 2);
  [-.06, .0].forEach(y => box(.07, .02, .01, M.plasticBlack, 0, y, .03, g));
  box(.06, .015, .012, M.chrome, 0, -.15, .03, g);
  for (let i = 0; i < 3; i++) cyl(.008, .008, .008, M.chrome, .07 + i * .022, -.12 - i * .02, .03, g, 10).rotation.x = PI / 2;
  // alça
  const strap = new THREE.CatmullRomCurve3([new THREE.Vector3(0, -.24, -.02), new THREE.Vector3(-.2, .1, -.12), new THREE.Vector3(-.1, .5, -.15), new THREE.Vector3(.05, .32, -.04)]);
  mesh(new THREE.TubeGeometry(strap, 30, .012, 6, false), M.rubber, 0, 0, 0, g);
  return g;
}

  box(.46, .26, .03, M.plasticBlack, 0, .255, -.29, cs).rotation.x = -.35;
  label('CONSOLE MONITOR\nPRÓPRIA 2ZDINIZZ', 6.6, DECK + 2.45, -3.6, { accent: true, size: .3 });
}

// ================================================================== LUZ
scene.add(new THREE.HemisphereLight(0x8890a8, 0x1a0f08, .35));
const key = new THREE.SpotLight(0xfff0dd, 220, 45, .55, .55, 1.6); key.position.set(0, 13, 10); key.target.position.set(0, DECK, -3);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0003; key.shadow.normalBias = .02; scene.add(key, key.target);
[-1, 1].forEach(s => { const f = new THREE.SpotLight(0xffe2c4, 60, 30, .5, .6, 1.6); f.position.set(s * 7, 9, 6); f.target.position.set(s * 2, DECK, -3); scene.add(f, f.target); });
const rims = [-1, 1].map(s => { const r = new THREE.SpotLight(0xff2a3a, 70, 20, .5, .6, 1.5); r.position.set(s * 4, DECK + 5.4, -5.2); r.target.position.set(s * 1.5, DECK, -2.4); scene.add(r, r.target); return r; });
const fillD = new THREE.DirectionalLight(0xbfc8ff, .25); fillD.position.set(-8, 10, 6); scene.add(fillD);
const houseLight = new THREE.AmbientLight(0xffffff, 0); scene.add(houseLight);

// ================================================================== UI / CÂMERAS
const cams = {
  publico: { p: [0, 5.0, 14.5], t: [0, 2.6, -3] },
  cima: { p: [0, 20, -2.6], t: [0, 1.6, -3] },
  lateral: { p: [-10.5, 9.5, 4.2], t: [-.5, 1.9, -3.2] },
  palco: { p: [3.4, 4.1, .8], t: [-.8, 2.3, -4.4] },
};
let anim = null; let curCam = 'publico';
function goCam(name, instant) {
  const c = cams[name]; const t1 = new THREE.Vector3(...c.t);
  const asp = window.innerWidth / window.innerHeight; const k = asp < 1.2 ? Math.min(1.75, .82 / asp) : 1;
  const p1 = new THREE.Vector3(...c.p).sub(t1).multiplyScalar(k).add(t1);
  curCam = name;
  document.querySelectorAll('nav [data-cam]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cam === name ? 'true' : 'false'));
  if (instant) { camera.position.copy(p1); controls.target.copy(t1); controls.update(); return; }
  anim = { p0: camera.position.clone(), t0: controls.target.clone(), p1, t1, start: performance.now(), dur: 1200 };
}
document.querySelectorAll('nav [data-cam]').forEach(b => b.addEventListener('click', () => goCam(b.dataset.cam)));
const btnL = document.getElementById('btnLabels');
btnL.addEventListener('click', () => { const on = btnL.getAttribute('aria-pressed') !== 'true'; btnL.setAttribute('aria-pressed', on); labels.forEach(l => l.visible = on); });
const btnS = document.getElementById('btnSpin');
btnS.addEventListener('click', () => { const on = btnS.getAttribute('aria-pressed') !== 'true'; btnS.setAttribute('aria-pressed', on); controls.autoRotate = on; controls.autoRotateSpeed = .7; });
let show = true; const btnShow = document.getElementById('btnShow');
btnShow.addEventListener('click', () => {
  show = !show; btnShow.setAttribute('aria-pressed', show);
  beams.forEach(b => b.bm.visible = show); rims.forEach(r => r.intensity = show ? 70 : 0);
  houseLight.intensity = show ? 0 : .35; scene.fog.density = show ? .022 : .008; bloom.strength = show ? .55 : .25;
});
goCam('publico', true);

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
document.getElementById('loading').remove();
function loop(now) {
  requestAnimationFrame(loop);
  if (anim) { const k = Math.min(1, (now - anim.start) / anim.dur), e = ease(k); camera.position.lerpVectors(anim.p0, anim.p1, e); controls.target.lerpVectors(anim.t0, anim.t1, e); if (k >= 1) anim = null; }
  if (show) beams.forEach(b => { b.yoke.rotation.y = b.ph + Math.sin(now * .00035 + b.ph) * .5; b.head.rotation.x = .3 + Math.sin(now * .0005 + b.ph * 1.7) * .25; });
  ledGlow.intensity = 8 + Math.sin(now * .002) * 1.5;
  overhead.visible = camera.position.y < vaultY(camera.position.x) - .6;
  controls.update();
  renderer.clear();
  composer.render();
  renderer.clearDepth();
  renderer.render(labelScene, camera);
}
requestAnimationFrame(loop);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
  if (!controls.autoRotate) goCam(curCam, true);
});
</script>
</body>
